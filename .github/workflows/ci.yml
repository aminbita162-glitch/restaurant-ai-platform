name: Smoke CI

on:
  push:
    branches:
      - main

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install Flask==3.0.0 pytest

      - name: Run fail-closed smoke tests
        run: python backend/tests/test_fail_closed.py
        env:
          PIPELINE_DB_PATH: /tmp/ci_smoke_test.db
